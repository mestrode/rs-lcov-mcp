[package]
name = "rs-lcov-mcp"
version = "0.2.0"
edition = "2024"
description = "A Rust MCP server for generating LCOV coverage reports from LLVM coverage data."
authors = ["mestrode <35630715+mestrode@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mestrode/rs-lcov-mcp"
homepage = "https://github.com/mestrode/rs-lcov-mcp"
documentation = "https://docs.rs/rs-lcov-mcp"
keywords = ["mcp", "coverage", "rust", "llvm-cov", "testing"]
categories = ["development-tools::testing", "development-tools::profiling"]

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2.0"
