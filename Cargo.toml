[package]
name = "rust-tools-mcp"
version = "0.3.0"
edition = "2024"
description = "A Rust MCP server for cargo development tools and code coverage analysis using cargo-llvm-cov."
authors = ["mestrode <35630715+mestrode@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mestrode/rust-tools-mcp"
homepage = "https://github.com/mestrode/rust-tools-mcp"
documentation = "https://docs.rs/rust-tools-mcp"
keywords = ["mcp", "coverage", "rust", "llvm-cov", "testing", "cargo", "development-tools"]
categories = ["development-tools::testing", "development-tools::profiling", "development-tools::build-utils"]

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2.0"
